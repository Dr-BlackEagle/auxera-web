<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auxera">
<meta name="theme-color" content="#0b0c10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="lame.min.js" defer></script>
<script src="mp4-muxer.min.js" defer></script>
<title>Auxera</title>
<style>
:root{
  --bg:#0d0e12; --panel:#14161c; --raise:#1b1e26; --raise2:#232733; --line:#2a2f3a; --line2:#353b48;
  --text:#e9ebf1; --muted:#8c93a3; --dim:#7a8191;
  --wave:#2fe0c0; --wave2:#1a8f7c; --waveSel:#d8f3ff; --sel:rgba(120,150,255,.20); --selEdge:#8fa6ff;
  --accent:#8b7cff; --accent2:#a99dff; --rec:#ff4d5c; --amber:#ffc44d; --ok:#3ddc84; --warn:#ffb020; --bad:#ff5a67;
  --breath:rgba(255,170,60,.28); --breathOff:rgba(140,147,163,.16);
  --r:12px; --tab:52px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;font-size:14px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);caret-color:var(--wave)}
::placeholder{color:var(--dim);opacity:1}
:root{color-scheme:dark}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.f{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hide{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- home ---------- */
#home{padding:env(safe-area-inset-top) 0 0}
.hhead{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.logo{display:flex;align-items:center;gap:10px;flex:1}
.logo b{font-size:21px;letter-spacing:.3px;font-weight:700}
.logo small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:1px}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--text)}
.iconbtn:active{background:var(--raise2)}
.iconbtn:disabled{opacity:.32}
.hactions{display:flex;gap:10px;padding:10px 16px 14px}
.big{flex:1;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:650;font-size:15px}
.big.rec{background:var(--rec);color:#fff;box-shadow:0 6px 20px rgba(255,77,92,.25)}
.big.sec{background:var(--raise);border:1px solid var(--line)}
.big:active{transform:scale(.98)}
.list{flex:1;overflow:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom))}
.lt{color:var(--muted);font-size:12px;letter-spacing:.6px;text-transform:uppercase;margin:6px 2px 8px}
.card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px 12px 14px;margin-bottom:10px}
.card:active{background:var(--raise)}
.card .thumb{width:44px;height:44px;border-radius:10px;background:var(--raise2);display:grid;place-items:center;color:var(--wave)}
.card .meta{flex:1;min-width:0}
.card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--muted);font-size:12.5px;margin-top:3px}
.empty{color:var(--muted);text-align:center;padding:40px 20px;line-height:1.55}
.empty svg{width:64px;height:64px;color:var(--dim);margin-bottom:10px}

/* ---------- editor ---------- */
#editor{display:grid;padding-top:env(safe-area-inset-top);
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto auto minmax(0,1fr) auto auto auto;
  grid-template-areas:"top" "info" "over" "wave" "zoom" "tools" "trans"}
#editor>*{min-width:0}
.top{grid-area:top;display:flex;align-items:center;gap:2px;padding:4px 6px;border-bottom:1px solid var(--line)}
.pname{flex:1;min-width:0;padding:6px 8px;border-radius:10px;text-align:left}
.pname b{display:block;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname small{color:var(--muted);font-size:11.5px}
.pname:active{background:var(--raise2)}
.info{grid-area:info;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:8px 14px 6px}
.clockwrap{min-width:0}
.lname{display:none;font-size:13px;font-weight:600;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;text-align:left}
.clock{font-size:30px;font-weight:300;letter-spacing:.5px;line-height:1}
.clock.play{color:var(--amber)}
.selinfo{display:grid;grid-template-columns:auto auto;gap:1px 8px;font-size:11.5px;color:var(--muted);text-align:right}
.selinfo span:nth-child(2n){color:var(--text)}
.over{grid-area:over;height:30px;margin:0 10px;position:relative;border-radius:7px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.over canvas{width:100%;height:100%;display:block}
.wavebox{grid-area:wave;position:relative;min-height:150px;margin:8px 0 0;display:flex;flex-direction:row}
.wcol{flex:1;min-width:0;display:flex;flex-direction:column}
.rrow{display:flex;flex:none;height:20px}
.rrow .ruler{flex:1;min-width:0}
.dbhead{width:46px;flex:none;font-size:10.5px;color:var(--muted);background:var(--panel);border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
.dbhead.hot{color:var(--amber)}.dbhead.over{color:var(--bad)}
.dbhead.clip{background:var(--rec);color:#fff;font-weight:700}
.wrow{flex:1;display:flex;min-height:0}
.dbcol{width:46px;flex:none;position:relative;background:var(--panel);border-left:1px solid var(--line)}
.dbcol canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vmeter{width:46px;flex:none;display:flex;flex-direction:column;align-items:stretch;border-left:1px solid var(--line);background:var(--panel);padding:4px 4px 6px}
.vm-clip{height:16px;border-radius:4px;background:#2a1418;color:#6b3a40;font-size:9.5px;font-weight:700;display:grid;place-items:center;letter-spacing:.5px}
.vm-clip.on{background:var(--rec);color:#fff}
.vm-val{height:20px;font-size:11.5px;text-align:center;line-height:20px;color:var(--text);font-weight:600}
.vm-val.hot{color:var(--amber)}.vm-val.over{color:var(--bad)}
.vm-body{flex:1;position:relative;display:flex;gap:3px;min-height:0;margin:10px 0 6px}
.vm-scale{flex:1;position:relative;font-size:11px;color:var(--dim)}
.vm-scale span{position:absolute;right:0;transform:translateY(50%);line-height:1}
.vm-scale i{position:absolute;right:-3px;width:3px;height:1px;background:var(--line2);transform:translateY(50%)}
.vm-track{width:11px;position:relative;border-radius:3px;background:#181b22;overflow:hidden}
.vm-track b{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,#27c49f 0%,#2fe0c0 66%,#ffc44d 80%,#ff7a3d 90%,#ff4d5c 100%);background-size:100% var(--th,200px);background-position:bottom}
.vm-track b.pk{opacity:.45}
.vm-track u{position:absolute;left:0;right:0;height:2px;background:#fff;bottom:0;opacity:0}
.lvl{font-size:11.5px;color:var(--muted);margin-top:3px;min-height:15px;white-space:nowrap}
.lvl b{color:var(--text);font-weight:600}
.ruler{height:20px;position:relative;flex:none;border-bottom:1px solid var(--line);touch-action:none}
.ruler canvas,.wave canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.wave{flex:1;position:relative;touch-action:none;background:linear-gradient(180deg,#101217,#0d0e12)}
.vz{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.pill{height:30px;min-width:38px;padding:0 9px;border-radius:15px;background:rgba(27,30,38,.86);border:1px solid var(--line2);font-size:12px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--text);backdrop-filter:blur(6px)}
.pill:active{background:var(--raise2)}
.pill.on{background:var(--wave);border-color:var(--wave);color:#0d0e12}
.mstrip{flex:none;display:flex;align-items:center;gap:2px;height:32px;margin:0 8px 6px;padding:0 4px 0 10px;border-radius:9px;background:rgba(255,77,92,.08);border:1px solid rgba(255,77,92,.35);font-size:12.5px;min-width:0}
.mstrip .mi{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);margin-left:6px}
.mstrip .ic{width:16px;height:16px}
.mstrip .flag{color:#ff5c6a;flex:none}
.mstrip button{height:26px;min-width:30px;padding:0 8px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:4px;color:var(--text);font-size:12px;flex:none}
.mstrip button:active{background:var(--raise2)}
.mstrip button:disabled{opacity:.35}
.mstrip #mSel{background:rgba(255,77,92,.18)}
.selinfo{cursor:pointer;border-radius:8px;padding:3px 4px}
.selinfo:active{background:var(--raise2)}
.nud{display:flex;gap:6px;align-items:center}
.nud .field{flex:1;min-width:0;text-align:center}
.nud button{height:40px;min-width:46px;border-radius:10px;background:var(--raise);border:1px solid var(--line2);font-size:12.5px;flex:none}
.nud button:active{background:var(--raise2)}
.hsearch{padding:0 16px 8px}.hsearch.hide{display:none}
.hfoot{color:var(--dim);font-size:12px;text-align:center;padding:4px 16px calc(16px + env(safe-area-inset-bottom))}
.empty-wave{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px;pointer-events:none;line-height:1.5}
.ew-btns{display:flex;flex-direction:column;gap:10px;margin:14px auto 10px;width:min(260px,80%);pointer-events:auto}
.ew-btns .btn{flex:none}
.empty-wave small{display:block;font-size:12px;color:var(--dim);max-width:260px;margin:0 auto}
.zoom{grid-area:zoom;display:flex;align-items:center;gap:6px;padding:8px 10px 4px;overflow-x:auto;scrollbar-width:none}
.zoom::-webkit-scrollbar,.toolrow::-webkit-scrollbar{display:none}
.zb{height:34px;padding:0 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap;flex:none}
.zb:active{background:var(--raise2)}
.zb .ic{width:18px;height:18px}
.sp{flex:1}
.tools{grid-area:tools;border-top:1px solid var(--line);background:var(--panel)}
.tabs{display:flex;padding:6px 8px 0;gap:4px}
.tabs button{flex:1;height:32px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:550}
.tabs button.on{background:var(--raise2);color:var(--text)}
.toolrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 4px;padding:6px 6px 8px}
.tool{min-width:0;height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;color:var(--text)}
.tool:active{background:var(--raise2)}
.tool:disabled{opacity:.3}
.tool .ic{width:23px;height:23px}
.tool.acc .ic{color:var(--wave)}
.trans{grid-area:trans;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 10px calc(8px + env(safe-area-inset-bottom));background:var(--panel)}
.tb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.tb:active{background:var(--raise2)}
.tb:disabled{opacity:.3}
.tb.play{width:58px;height:58px;background:var(--text);color:#0d0e12}
.tb.play .ic{width:26px;height:26px}
.tb.rec{background:var(--rec);color:#fff;width:58px;height:58px}
.tb.punch{border:1.5px solid var(--rec);color:var(--rec)}
.tsep{width:1px;height:30px;background:var(--line);margin:0 6px}

/* landscape: waveform left, controls right */
@media (orientation:landscape) and (max-height:600px){
  #editor{grid-template-columns:minmax(0,1fr) 296px;grid-template-rows:auto auto auto minmax(0,1fr) auto;
    grid-template-areas:"info top" "over tools" "wave tools" "wave tools" "zoom trans";padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .top{border-bottom:0;border-left:1px solid var(--line);background:var(--panel)}
  .tools{border-top:0;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .toolrow{display:grid;grid-template-columns:repeat(3,1fr);overflow:auto;align-content:start;flex:1}
  .tool{min-width:0;height:56px}
  .trans{border-left:1px solid var(--line);padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .tb{width:42px;height:42px}.tb.play,.tb.rec{width:50px;height:50px}
  .info{padding:6px 12px 4px}.clock{font-size:24px}
  .pname{display:none}.lname{display:block}.top{justify-content:space-between}
  .over{height:24px}.wavebox{margin-top:4px;min-height:0}
  .vmeter{width:42px}.lvl{display:none}
  .zoom{padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
  .zb{height:32px}
}
@media (orientation:landscape) and (min-height:601px){
  #editor{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto auto auto minmax(0,1fr) auto;
    grid-template-areas:"info top" "over tools" "wave tools" "wave tools" "zoom trans"}
  .top{border-left:1px solid var(--line);background:var(--panel)}
  .pname small{display:none}
  .tools{border-left:1px solid var(--line);display:flex;flex-direction:column}
  .toolrow{display:grid;grid-template-columns:repeat(3,1fr);align-content:start;flex:1}
  .trans{border-left:1px solid var(--line)}
}

/* ---------- sheets / dialogs ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.scrim.light{background:rgba(0,0,0,.12)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;
  max-height:78%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet.compact{max-height:56%}
.sheet.on ~ .toast{bottom:auto;top:calc(64px + env(safe-area-inset-top))}
@media (orientation:landscape){ .sheet{left:auto;right:0;top:0;bottom:0;width:min(420px,64vw);max-height:none;border-radius:18px 0 0 18px;border-top:0;border-left:1px solid var(--line2);transform:translateX(105%);padding-top:env(safe-area-inset-top)} .sheet.on{transform:none} .sheet.compact{max-height:none} .sheet .grab{display:none} }
.sh-h{display:flex;align-items:center;gap:8px;padding:14px 10px 6px 18px}
.sh-h h3{margin:0;font-size:17px;flex:1;font-weight:650}
.sh-b{overflow:auto;padding:4px 18px 18px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0}
.hint{color:var(--muted);font-size:13px;line-height:1.5;margin:4px 0 12px}
.target{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin-bottom:12px}
.target b{color:var(--text);font-weight:600}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}
.row label{flex:1;color:var(--text);font-size:13.5px}
.row .v{min-width:64px;text-align:right;color:var(--wave);font-size:13px}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--text);margin-top:-9px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.seg{display:flex;background:var(--raise);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin:6px 0 12px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px;height:34px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--raise2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;height:46px;border-radius:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--raise);border:1px solid var(--line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dan{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:active{filter:brightness(1.15)}
.btn:disabled{opacity:.35}
.btn .ic{width:19px;height:19px}
.step{display:flex;gap:10px;align-items:flex-start;margin:6px 0 4px}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--raise2);display:grid;place-items:center;font-size:12px;flex:none;color:var(--muted)}
.step.done i{background:var(--wave2);color:#fff}
.step div{flex:1}
.step b{font-weight:600}
.badge{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--raise2);color:var(--muted);margin-left:6px}
.badge.ok{background:rgba(61,220,132,.15);color:var(--ok)}
.field{width:100%;height:44px;border-radius:11px;border:1px solid var(--line2);background:var(--raise);padding:0 12px;outline:none}
.field:focus{border-color:var(--accent)}
.meters{display:grid;grid-template-columns:1fr auto auto;gap:10px 12px;align-items:center;margin:8px 0}
.meters .k{color:var(--muted);font-size:13px}
.meters .val{font-size:16px}
.mark{font-size:12px;padding:3px 8px;border-radius:7px}
.mark.ok{background:rgba(61,220,132,.14);color:var(--ok)}
.mark.no{background:rgba(255,90,103,.14);color:var(--bad)}
.mark.na{background:var(--raise2);color:var(--muted)}
.hrow{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:0 10px;border-radius:11px;text-align:left;margin-bottom:2px}
.hrow:active{background:var(--raise)}
.hrow .ic{width:17px;height:17px;color:var(--dim)}
.hrow.rec .ic{color:var(--rec)}
.hrow.c{background:var(--raise2);box-shadow:inset 0 0 0 1px var(--line2)}
.hrow.c .ic{color:var(--accent2)}
.hrow.r{opacity:.42}
.hrow .hl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hd{color:var(--muted);font-size:12px}
.hsep{color:var(--muted);font-size:12px;letter-spacing:.5px;text-transform:uppercase;margin:14px 2px 6px}
.set-sec{color:var(--muted);font-size:12px;letter-spacing:.6px;text-transform:uppercase;margin:16px 0 4px}
.set-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0;border-bottom:1px solid var(--line)}
.set-row label{flex:1}
.set-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
select.field{height:38px;width:auto;max-width:56%;padding:0 8px}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.menu{position:fixed;z-index:61;background:var(--raise);border:1px solid var(--line2);border-radius:14px;padding:6px;min-width:190px;box-shadow:0 12px 40px rgba(0,0,0,.5);max-height:calc(100vh - 16px);overflow-y:auto;overscroll-behavior:contain}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 12px;border-radius:9px;text-align:left}
.menu button:active{background:var(--raise2)}
.menu button.dan{color:var(--bad)}
.dialog{position:fixed;z-index:62;left:50%;top:42%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 40px));background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:18px}
.dialog h3{margin:0 0 8px;font-size:17px}
.dialog p{margin:0 0 12px;color:var(--muted);line-height:1.5}
.toast.top{bottom:auto;top:calc(env(safe-area-inset-top) + 70px)}

.jobbar .js{font-size:11.5px;color:var(--muted)}
.jobbar .bar{height:4px;margin-top:5px}
.jobbar button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--raise2);flex:none}
@media (orientation:landscape){ .jobbar{left:auto;width:min(420px,60vw)} }
.abchip{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 64px);z-index:67;background:var(--raise);border:1px solid var(--wave);color:var(--text);border-radius:20px;height:40px;padding:0 16px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);white-space:nowrap}
.abchip b{color:var(--wave)}.abchip.orig b{color:var(--amber)}.abchip.hide{display:none}
.intro{position:fixed;inset:0;z-index:80;background:rgba(8,9,12,.82);display:grid;place-items:center;padding:20px}

.intro .ih{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:650;margin-bottom:10px}
.intro .ih .ic{width:26px;height:26px;color:var(--wave)}
.intro p{color:var(--text);line-height:1.55;font-size:14.5px;margin:0 0 14px}

.intro .dots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}.intro .dots i.on{background:var(--wave)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:70;background:#e9ebf1;color:#111;padding:11px 16px;border-radius:12px;font-size:13.5px;max-width:calc(100% - 40px);opacity:0;transition:all .2s;pointer-events:none;text-align:center;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%)}
.busy{position:fixed;inset:0;z-index:65;background:rgba(8,9,12,.7);display:grid;place-items:center}

/* ---------- record overlay ---------- */
#recov{position:fixed;inset:0;z-index:50;background:#0a0b0e;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 0 calc(8px + env(safe-area-inset-bottom))}
.rv-top{display:flex;align-items:center;justify-content:space-between;padding:4px 18px}
.rv-mode{font-weight:650;font-size:15px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rec)}
.dot.blink{animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.rv-src{color:var(--muted);font-size:12px}
.rv-tr{display:flex;align-items:center;gap:10px;min-width:0}
.rv-txt{height:30px;padding:0 10px;font-size:12.5px;gap:5px}
#recov.script .rv-txt{display:none}
.rv-ghint{display:none;margin:-6px 14px 0;color:var(--amber);font-size:12px;line-height:1.4;flex:none}
.rv-ghint.on{display:block}
body.recsheet .scrim{z-index:58} body.recsheet .sheet{z-index:59}
.rv-main{flex:1;display:flex;min-height:0}
.rv-left{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:16px;min-height:0}
.rv-head{display:flex;flex-direction:column;align-items:center;gap:6px}
.rv-time{font-size:60px;font-weight:200;text-align:center;letter-spacing:1px}
.rv-state{text-align:center;color:var(--muted);min-height:20px}
.rv-state.pre{color:var(--amber)}
.rv-wave{height:110px;position:relative;flex:none}
.rv-wave canvas{width:100%;height:100%;display:block}
.rv-db{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 14px;color:var(--muted);font-size:12px;flex:none}
.rv-db b{font-size:21px;color:var(--text);font-weight:500;margin-right:3px}
.rv-db b.hot{color:var(--amber)}.rv-db b.over{color:var(--bad)}
.cliptag{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:5px;background:var(--rec);color:#fff;font-size:11px;font-weight:700}
.rv-note{color:var(--muted);text-align:center;font-size:12.5px;padding:0 20px;line-height:1.45}
.rv-meter{width:62px;flex:none;display:flex;flex-direction:column;padding:6px 8px 6px 4px;border-left:1px solid #1d2028}
.rv-meter .vm-track{width:15px}
.rv-meter .vm-val{font-size:13px}
.vm-track s{position:absolute;left:0;right:0;background:rgba(255,196,77,.2);border-top:1px solid #ffc44d;border-bottom:1px solid #ffc44d;pointer-events:none}
.rv-gain{display:flex;align-items:center;gap:10px;margin:0 14px;flex:none}
.rv-gain span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.rv-gain input{flex:1;min-width:0}
.rv-gain b{min-width:64px;text-align:right;font-weight:500;color:var(--wave);font-size:14px}
#recov.ready .rv-stop{border-color:var(--rec)}
#recov.ready .rv-stop i{border-radius:50%;width:38px;height:38px}
#recov.ready .rv-time{color:var(--amber)}
.rv-ctl{display:flex;align-items:center;justify-content:center;gap:26px;padding:10px 0 4px}
.rv-stop{width:76px;height:76px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center}
.rv-stop i{width:28px;height:28px;border-radius:6px;background:var(--rec);display:block}
.rv-side{width:54px;height:54px;border-radius:50%;background:var(--raise);display:grid;place-items:center}
.rv-mark{color:#ff5c6a;position:relative;border:1.5px solid rgba(255,92,106,.6)}
.rv-mark b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#ff5c6a;color:#fff;font-size:11.5px;line-height:20px;display:none}
.rv-mark b.on{display:block}
.rv-mark.flash{animation:mkf .45s}
@keyframes mkf{0%{background:#ff5c6a;color:#fff}100%{background:var(--raise)}}
#recov.ready .rv-mark{visibility:hidden}
.rv-free{color:var(--dim);font-size:12px;text-align:center;flex:none}.rv-free.low{color:var(--amber)}
#recov.script .rv-free{display:none}
.countdown{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:rgba(11,12,16,.92);font-size:120px;font-weight:200}
/* teleprompter inside the record screen */
.rv-prompt{display:none;position:relative;flex:1;min-height:0;overflow:hidden;margin:0 4px 0 16px;touch-action:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 86%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 86%,transparent 100%)}
.pr-inner{position:absolute;left:0;right:6px;top:0;will-change:transform;font-size:var(--prs,28px);line-height:1.42}
.pr-inner p{margin:0 0 .45em;color:#a4abb8;transition:color .2s}
.pr-inner p.np{margin-top:.9em}
.pr-inner p.past{color:#4c5260}
.pr-inner p.cur{color:#fff}
.pr-mark{position:absolute;left:-14px;right:0;height:0;border-top:1.5px dashed rgba(255,196,77,.5);pointer-events:none}
.pr-mark::before{content:"";position:absolute;left:0;top:-7px;border:6px solid transparent;border-left:8px solid #ffc44d}
.pr-ctl{display:none;align-items:center;justify-content:center;gap:6px;padding:6px 10px 0;flex-wrap:nowrap}
.pr-ctl .pill{height:36px;min-width:36px;white-space:nowrap;padding:0 9px;flex:none}
.pr-ctl .num{min-width:36px;text-align:center;color:var(--muted);font-size:12px;flex:none}
#recov.script .rv-prompt{display:block}
#recov.script .pr-ctl{display:flex}
#recov.script .rv-left{justify-content:flex-start;gap:8px}
#recov.script .rv-head{flex-direction:row;justify-content:space-between;padding:0 16px}
#recov.script .rv-time{font-size:26px;font-weight:300}
#recov.script .rv-state{text-align:right;font-size:13px}
#recov.script .rv-wave{height:52px}
#recov.script .rv-note{display:none}
#recov.script .rv-db b{font-size:16px}
@media (orientation:landscape) and (max-height:600px){
  .rv-time{font-size:44px}
  .rv-wave{height:80px}
  .rv-left{gap:8px}
  .rv-ctl{padding:4px 0 0;gap:22px}
  .rv-stop{width:60px;height:60px}.rv-side{width:46px;height:46px}
  #recov.script .rv-wave,#recov.script .rv-db{display:none}
  #recov.script .rv-ctl{position:absolute;right:76px;bottom:calc(8px + env(safe-area-inset-bottom));padding:0;gap:12px}
  #recov.script .pr-ctl{justify-content:flex-start;padding-left:16px}
  #recov.script .rv-gain{margin-right:196px}
  #recov.script .rv-ghint{display:none}
}

<script type="text/plain" id="appMain">
"use strict";
// =====================================================================================
// helpers
// =====================================================================================
const $ = id => document.getElementById(id);
const AX = window.AX;
function J(s){ try{ return JSON.parse(s); }catch(e){ return null; } }
function ic(name, cls){ return `<svg class="ic ${cls||''}"><use href="#i-${name}"/></svg>`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function b64s(str){ // base64 -> Int16Array
  if(!str) return new Int16Array(0);
  const bin = atob(str); const n = bin.length>>1; const out = new Int16Array(n);
  for(let i=0;i<n;i++){ let v = bin.charCodeAt(2*i) | (bin.charCodeAt(2*i+1)<<8); out[i] = v>32767? v-65536 : v; }
  return out;
}
function fmtT(samples, sr, prec){
  if(prec==null) prec=2;
  let t = Math.max(0, samples/sr);
  const h = Math.floor(t/3600); t -= h*3600;
  const m = Math.floor(t/60); t -= m*60;
  let s = t.toFixed(prec); if(t<10) s = '0'+s;
  if(s.startsWith('60')) s = (prec? '59.'+'9'.repeat(prec):'59');
  const mm = (m<10?'0':'')+m;
  return (h? h+':' : '') + mm + ':' + s.replace('.', ',');
}
function fmtDur(samples, sr){
  const t = samples/sr;
  if(t<60) return t.toFixed(1).replace('.',',')+' sn';
  const m = Math.floor(t/60), s = Math.round(t%60);
  if(m<60) return m+' dk '+s+' sn';
  return Math.floor(m/60)+' sa '+(m%60)+' dk';
}
function fmtBytes(b){ if(b<1024*1024) return Math.max(1,Math.round(b/1024))+' KB'; if(b<1024*1024*1024) return (b/1048576).toFixed(1).replace('.',',')+' MB'; return (b/1073741824).toFixed(2).replace('.',',')+' GB'; }
function fmtDate(ms){ const d = new Date(ms); const p = n=>(n<10?'0':'')+n; return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function dbs(v, d){ if(v==null||v<-200) return '−∞'; return (v>0?'+':'')+v.toFixed(d==null?1:d).replace('.',',').replace('-','−'); }
let toastT=0;
function toast(msg, ms){ const t=$('toast'); t.classList.toggle('top', $('sheet').classList.contains('on')); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'), ms||2600); }
function vib(){ try{ navigator.vibrate && navigator.vibrate(12); }catch(e){} }

// =====================================================================================
// state
// =====================================================================================
const S = {
  screen:'home', st:null, len:0, sr:48000,
  start:0, spp:100,        // view: first visible sample, samples per CSS pixel
  cursor:0, sel:null,      // sel = {a,b}
  playing:false, ppos:-1, vz:1, tab:'edit',
  breath:null,             // {regions:[{a,b,on}], idx}
  settings:{}, jobCb:null, permCb:null,
  marks:[], mIdx:-1, markSel:null, pan:false, busy:false, ab:false, hq:''
};
function loadSettings(){ S.settings = J(AX.settings()) || {}; }

// =====================================================================================
// home
// =====================================================================================
function showScreen(name){
  S.screen = name;
  $('home').classList.toggle('hide', name!=='home');
  $('editor').classList.toggle('hide', name!=='editor');
  if(name==='editor'){ mstripUpd(); panUpd(); requestAnimationFrame(()=>{ resize(); fit(); draw(true); }); }
}
function renderHome(){
  const all = J(AX.projects()) || [];
  const el = $('plist');
  $('hSearchW').classList.toggle('hide', all.length < 4);
  const q = (S.hq||'').trim().toLocaleLowerCase('tr');
  const list = q ? all.filter(p=>p.name.toLocaleLowerCase('tr').includes(q)) : all;
  const stg = J(AX.storage ? AX.storage() : '{}') || {};
  $('hFoot').textContent = all.length && stg.free!=null ? 'Kayıtlar '+fmtBytes(stg.used||0)+' · Boş alan '+fmtBytes(stg.free) : '';
  if(!list.length && all.length){ el.innerHTML = `<div class="empty"><div>“${esc(S.hq)}” ile eşleşen kayıt yok.</div></div>`; return; }
  if(!list.length){
    el.innerHTML = `<div class="empty"><svg class="ic" viewBox="0 0 24 24"><use href="#i-mic"/></svg><div><b style="color:var(--text)">Henüz kayıt yok</b><br>“Yeni kayıt” ile mikrofondan kayda başlayın ya da var olan bir ses dosyasını açıp düzenleyin.</div></div>`;
    return;
  }
  el.innerHTML = `<div class="lt">Kayıtlar</div>` + list.map(p=>`
    <div class="card" data-id="${esc(p.id)}">
      <div class="thumb">${ic('noise')}</div>
      <div class="meta"><div class="t">${esc(p.name)}</div><div class="s num">${fmtT(p.len, p.sr||48000, 1)} · ${fmtDate(p.modified)} · ${fmtBytes(p.bytes)}</div></div>
      <button class="iconbtn" data-menu="${esc(p.id)}" aria-label="Seçenekler">${ic('more')}</button>
    </div>`).join('');
  el.querySelectorAll('.card').forEach(c=>{
    c.onclick = ev=>{
      const m = ev.target.closest('[data-menu]');
      if(m){ ev.stopPropagation(); projMenu(m, list.find(x=>x.id===m.dataset.menu)); return; }
      openProject(c.dataset.id);
    };
  });
}
$('hSearch').oninput = e=>{ S.hq = e.target.value; renderHome(); };
function projMenu(anchor, p){
  popMenu(anchor, [
    {label:'Yeniden adlandır', icon:'edit', fn:()=>renameDialog(p.id, p.name, ()=>renderHome())},
    {label:'Kopyasını oluştur', icon:'copy', fn:()=>{ const r = J(AX.duplicate(p.id)); if(r && r.ok!==false){ renderHome(); toast('Kopya oluşturuldu · '+fmtBytes(p.bytes)); } else toast((r&&r.error)||'Kopyalanamadı', 3500); }},
    {label:'Sil', icon:'trash', dan:true, fn:()=>confirmDialog('Kayıt silinsin mi?', `“${p.name}” kalıcı olarak silinecek.`, 'Sil', ()=>{ AX.remove(p.id); renderHome(); toast('Silindi'); })}
  ]);
}
function openProject(id){
  const r = J(AX.open(id));
  if(!r || r.ok===false){ toast((r&&r.error)||'Açılamadı'); return; }
  enterEditor(r);
}
function enterEditor(st){
  setState(st);
  S.cursor = 0; S.sel = null; S.breath = null; S.ppos=-1;
  showScreen('editor');
  specCache = null; specPend = null; setSpec((()=>{try{return localStorage.getItem('spec')==='1'}catch(e){return false}})());
  loadScriptSent();
}
function newRecording(){
  const n = 'Kayıt ' + fmtDate(Date.now()).replace(/\./g,'-').replace(' ', ' ');
  const r = J(AX.create(n));
  if(!r || r.ok===false){ toast('Proje oluşturulamadı'); return; }
  enterEditor(r);
}
$('ewRec').onclick = ()=>startRecord('insert');
$('ewScript').onclick = ()=>sheetScript();
$('hNew').onclick = newRecording;
$('hOpen').onclick = ()=>AX.importFile();
$('hSettings').onclick = ()=>openSettings();

// =====================================================================================
// editor state
// =====================================================================================
function setState(st){
  if(!st || st.open===false) return;
  S.st = st; S.len = st.len||0; S.sr = st.sr||48000;
  $('eTitle').textContent = st.name; $('eNameL').textContent = st.name;
  $('eSub').textContent = (S.sr/1000).toString().replace('.',',')+' kHz · '+(st.bps===4?'32-bit':'16-bit')+' · '+fmtDur(S.len, S.sr);
  $('eUndo').disabled = !st.canUndo; $('eRedo').disabled = !st.canRedo;
  $('emptyWave').classList.toggle('hide', S.len>0);
  if(S.cursor > S.len) S.cursor = S.len;
  if(S.sel){ S.sel.a = Math.min(S.sel.a, S.len); S.sel.b = Math.min(S.sel.b, S.len); if(S.sel.b-S.sel.a < 1) S.sel=null; }
  overDirty = true;
  loadMarks();
  updateButtons();
}

const wave = $('wave'), wcv = $('waveCv'), rcv = $('rulerCv'), ocv = $('overCv'), dcv = $('dbCv');
let W=300, H=200, dpr = window.devicePixelRatio||1, overDirty = true, drawQ = false, peaksCache = null;
function resize(){

function minSpp(){ return 0.05; }

function clampView(){

function getPeaks(){
  const cols = wcv.width;
  const sppDev = S.spp/dpr;
  const key = S.start.toFixed(3)+'|'+sppDev.toFixed(6)+'|'+cols+'|'+S.len;
  if(peaksCache && peaksCache.key===key) return peaksCache;
  let res;

// ---- spectral view ----
const SPEC_ROWS = 160, SPEC_FMIN = 50;
let specCache = null, specPend = null, specId = 0, specGen = 0, specTimer = 0;
const SPEC_LUT = (()=>{ const st=[[0,[6,7,10]],[0.32,[12,30,58]],[0.52,[20,110,135]],[0.70,[47,224,192]],[0.86,[255,214,102]],[1,[255,255,255]]];
  const l=new Uint8ClampedArray(256*3);
  for(let i=0;i<256;i++){ const t=i/255; let k=0; while(k<st.length-2 && t>st[k+1][0]) k++; const t0=st[k][0], c0=st[k][1], t1=st[k+1][0], c1=st[k+1][1]; const u=Math.max(0,Math.min(1,(t-t0)/(t1-t0))); for(let j=0;j<3;j++) l[i*3+j]=c0[j]+(c1[j]-c0[j])*u; }
  return l; })();
function specRequest(){
  const cols = Math.max(1, Math.ceil(wcv.width/2)), sppC = S.spp/dpr*2;
  const key = S.start.toFixed(2)+'|'+sppC.toFixed(5)+'|'+cols+'|'+S.len+'|'+specGen;
  if((specCache && specCache.key===key) || (specPend && specPend.key===key)) return;
  clearTimeout(specTimer);
  const go = ()=>{ specId++; specPend = {id:specId, key, start:S.start, spp:sppC, cols}; try{ AX.spectrum(specId, S.start, sppC, cols, SPEC_ROWS); }catch(e){ specPend=null; } };
  if(specCache) specTimer = setTimeout(go, 90); else go();
}
function onSpec(d){
  if(!specPend || d.id!==specPend.id || !d.data) return;
  const raw = atob(d.data), cols = d.cols, rows = d.rows;
  const cv = document.createElement('canvas'); cv.width = cols; cv.height = rows;
  const cx = cv.getContext('2d'), im = cx.createImageData(cols, rows), px = im.data;
  for(let i=0;i<cols*rows;i++){ const v = raw.charCodeAt(i)*3, o = i*4; px[o]=SPEC_LUT[v]; px[o+1]=SPEC_LUT[v+1]; px[o+2]=SPEC_LUT[v+2]; px[o+3]=255; }

}
function specFreqY(f, ch){ const nyq = S.sr/2; return (1 - Math.log(f/SPEC_FMIN)/Math.log(nyq/SPEC_FMIN))*ch; }
function setSpec(on){
  S.spec = !!on; try{ localStorage.setItem('spec', S.spec?'1':'0'); }catch(e){}
  const b = $('specBtn'); if(b){ b.classList.toggle('on', S.spec); b.setAttribute('aria-pressed', S.spec?'true':'false'); }
  $('vzBtn').style.display = S.spec? 'none' : '';

function paint(){

  // dB grid (same scale as the ruler on the right)
  c.fillStyle = 'rgba(255,255,255,0.045)';
  for(const db of [-3,-6,-12,-18,-24,-36]){ const d = Math.pow(10,db/20)*amp; if(d < 8*dpr) continue; for(const y of [mid-d, mid+d]) if(y>0&&y<ch) c.fillRect(0, Math.round(y), cw, 1); }

  if(bd){

const DBPTS = [[-60,0],[-40,1/6],[-24,2/6],[-12,3/6],[-6,4/6],[-3,5/6],[0,1]];

}

// ---------- jobs ----------
let busyEl = null, busyTimer = 0;
function runJob(res, cb){
  const r = J(res);
  if(!r || r.ok===false){ toast((r&&r.error)||'Başlatılamadı', 3200); return false; }
  S.jobCb = cb||null;
  showBusy();
  return true;
}
function showBusy(){
  S.busy = true;
  if(!busyEl){
    busyEl = document.createElement('div'); busyEl.className='jobbar'; busyEl.setAttribute('role','status');
    busyEl.innerHTML = `<div class="jl"><div class="jt" id="bLb">İşleniyor</div><div class="bar"><i id="bBar"></i></div><div class="js num" id="bPc">%0</div></div><button id="bCancel" aria-label="İptal">${ic('x')}</button>`;
    document.body.appendChild(busyEl);
    $('bCancel').onclick = ()=>{ AX.cancelJob(); $('bLb').textContent='İptal ediliyor…'; };
    S.jobT0 = performance.now();
  }
  clearTimeout(busyTimer);
  const poll = ()=>{
    const j = J(AX.job()) || {};
    if(!busyEl) return;
    if(!/İptal/.test($('bLb').textContent)) $('bLb').textContent = j.label || 'İşleniyor';
    const f = j.p||0, p = Math.round(f*100), el = (performance.now() - S.jobT0)/1000;
    $('bBar').style.width = p+'%';
    let eta = '';
    if(f > 0.03 && el > 1.5){ const rem = el*(1-f)/f; eta = rem < 5 ? ' · az kaldı' : ' · yaklaşık '+fmtLeft(rem)+' kaldı'; }
    $('bPc').textContent = '%'+p+(eta || ' · bu sırada dinleyip gezinebilirsiniz');
    if(j.busy) busyTimer = setTimeout(poll, 200);
  };
  poll();
}
function hideBusy(){ S.busy = false; clearTimeout(busyTimer); if(busyEl){ busyEl.remove(); busyEl=null; } }

function onJob(ev){
  hideBusy();
  if(ev.state && ev.state.open) setState(ev.state);
  const cb = S.jobCb; S.jobCb = null;
  if(!ev.ok){
    if(ev.op==='import' && ev.cancelled) return;
    toast(ev.cancelled ? 'İptal edildi' : (ev.error || 'İşlem başarısız'), 3500);
    if(cb) cb(ev);
    return;
  }
  const r = ev.result;
  switch(ev.op){
    case 'import': { const st = J(AX.state()); if(st && st.open) enterEditor(st); toast('Dosya açıldı'); return; }
    case 'normalize': toast('Normalleştirildi ('+dbs(r.gainDb)+' dB)'); break;
    case 'noiseReduce': toast('Gürültü azaltıldı'); break;
    case 'autoNR': toast('Gürültü otomatik azaltıldı ('+r.db+' dB) · ham kayıt için Geri al', 3800); break;
    case 'heal': toast(r.fixed? (r.fixed===1?'Onarıldı':r.fixed+' nokta onarıldı') : 'Onarılacak klik bulunamadı'); break;
    case 'declick': toast(r.fixed? r.fixed+' klik/ağız sesi temizlendi' : 'Belirgin klik bulunamadı'); break;
    case 'fade': toast('Uygulandı'); break;
    case 'dehum': toast('Uğultu/gürleme temizlendi · önceki hali için Geri al'); break;
    case 'truncSilence': toast(r.count? r.count+' boşluk kısaltıldı · '+fmtDur(r.removed, S.sr)+' kazanıldı' : 'Kısaltılacak uzun boşluk yok', 3200); if(r.count) S.sel=null; break;
    case 'preview': S.playing = true; S.ppos = r.a; setPlayIcon(); pollPlay(); vmLoop(); S.ab = false; abUpd(true); break;
  }
  if(cb) cb(ev);
  clampView(); draw(true); updateButtons();
}

function sheetBreath(){

function focusBreath(i, play){

  const want = Math.max(len*6, S.sr*2.5);
  if(vis > want*3 || vis < len*1.5){ S.spp = clamp(want/W, minSpp(), maxSpp()); }
  S.start = (r.a+r.b)/2 - W*S.spp/2; clampView(); draw();
  if(play){ startPlay(Math.max(0, r.a - Math.round(S.sr*0.6)), Math.min(S.len, r.b + Math.round(S.sr*0.6))); }
}
function toggleBreathAt(t){
  const br = S.breath; if(!br) return false;
  const i = br.regions.findIndex(r=>t>=r.a && t<=r.b);
  if(i<0) return false;
  br.regions[i].on = !br.regions[i].on; br.idx = i; vib();
  if(sheetBreath.render) sheetBreath.render();
  draw(); return true;
}

// ---- history ----
function openHistory(){
  stopPlay();
  const h = J(AX.history());
  if(!h || h.ok===false){ toast((h&&h.error)||'Geçmiş açılamadı'); return; }
  const row = (it,k)=>`<button class="hrow ${it.t} ${it.rec?'rec':''}" data-k="${k}">${ic(it.rec?'mic':'dot')}<span class="hl">${esc(it.l)}</span>${k===h.cur?'<span class="badge ok">şu an</span>':''}<span class="hd num">${fmtT(it.len,S.sr,1)}</span></button>`;
  const fut = h.items.map((it,k)=>[it,k]).filter(x=>x[1]>h.cur).reverse();
  const past = h.items.map((it,k)=>[it,k]).filter(x=>x[1]<=h.cur).reverse();
  const canOrig = h.hasFirst && !h.atFirst;
  openSheet('Geçmiş', `
    <div class="btns" style="margin-top:0"><button class="btn ${canOrig?'pri':''}" id="hOrig" ${canOrig?'':'disabled'}>${ic('undo')}Orijinal kayda dön</button></div>
    <div class="hint" style="margin-top:8px">Orijinal, ilk kaydın hiç dokunulmamış hâlidir. Sonraki kayıtları da korumak istiyorsanız aşağıdan ilgili “Kayıt” adımına dokunun. Her adıma istediğiniz an geri dönebilirsiniz; işlemler kayıpsızdır.</div>
    ${fut.length? `<div class="hsep">Geri alınanlar</div>`+fut.map(x=>row(x[0],x[1])).join('') : ''}
    <div class="hsep">Adımlar (en yeni üstte)</div>
    ${past.map(x=>row(x[0],x[1])).join('')}`);
  $('shBody').querySelectorAll('.hrow').forEach(b=>b.onclick = ()=>{
    const k = +b.dataset.k; if(k===h.cur) return;
    const label = h.items[k].l;
    const r = J(AX.historyJump(k));
    if(applyResult(r)){ toast('“'+label+'” adımına dönüldü'); fitIfSmall(); openHistory(); }
  });
  $('hOrig').onclick = ()=>{ closeSheet(); revertOriginal(); };
}
function revertOriginal(){
  stopPlay();
  const r = J(AX.revertOriginal());
  if(applyResult(r)){ fitIfSmall(); toast('Orijinal kayda dönüldü · Yinele ya da Geçmiş ile geri gelebilirsiniz', 3600); }
}
function fitIfSmall(){ if(W*S.spp > S.len*1.05 || S.start > S.len) fit(); }
(function(){
  for(const id of ['eUndo','eRedo']){
    const b = $(id); let t = 0, long = false;
    b.addEventListener('pointerdown', ()=>{ long = false; clearTimeout(t); t = setTimeout(()=>{ long = true; vib(); openHistory(); }, 480); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev, ()=>clearTimeout(t)));
    b.addEventListener('click', e=>{ if(long){ e.stopImmediatePropagation(); e.preventDefault(); long = false; } }, true);
    b.addEventListener('contextmenu', e=>e.preventDefault());
  }
})();

      $('xRes').innerHTML = `<div class="hint" style="margin-top:16px"><b style="color:var(--text)">${esc(r.name)}</b> · ${fmtBytes(r.bytes)} hazır.</div>
        <div class="btns"><button class="btn" id="xSave">${ic('save')}Cihaza kaydet</button><button class="btn pri" id="xShare">${ic('share')}Paylaş</button></div>`;
      $('xSave').onclick = ()=>AX.saveExport();
      $('xShare').onclick = ()=>AX.shareExport();
    });
  };
}
$('eExport').onclick = ()=>{ stopPlay(); sheetExport(); };

// ---- settings ----
function openSettings(){
  loadSettings();
  const st = S.settings;
  const devs = J(AX.devices()) || [];
  const sw = (id,on)=>`<button class="switch ${on?'on':''}" id="${id}" aria-pressed="${on}"></button>`;
  const opt = (v,l,cur)=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${esc(l)}</option>`;
  openSheet('Ayarlar', `
    <div class="set-sec">Kayıt</div>
    <div class="set-row"><label>Örnekleme hızı<small>Yeni kayıtlar için. Seslendirme için 48 kHz önerilir.</small></label><select class="field" id="sSr">${opt(48000,'48 kHz',st.sr)}${opt(44100,'44,1 kHz',st.sr)}</select></div>
    <div class="set-row"><label>Kayıt çözünürlüğü<small>32-bit kayan nokta, ses kartı/profesyonel mikrofonla en temiz sonucu verir ve işlemlerde kalite kaybını önler. Dakikada ~11 MB yer kaplar.</small></label><select class="field" id="sRes">${opt('float','32-bit float',st.res)}${opt('16','16-bit',st.res)}</select></div>
    <div class="set-row"><label>Mikrofon işleme<small>Otomatik: dahili mikrofonda “Ses tanıma”, ses kartında “Ham giriş” kullanılır. Telefonun otomatik ses ayarları her ikisinde de kapalıdır. Dahili mikrofonda ham giriş çok kısık gelir; yüksek gain cızırtı yapar.</small></label><select class="field" id="sSrc">${opt('auto','Otomatik (önerilen)',st.src)}${opt('raw','Ham giriş',st.src)}${opt('voice','Ses tanıma',st.src)}${opt('mic','Standart',st.src)}</select></div>
    <div class="set-row"><label>Giriş cihazı<small>Yalnızca kayıt yapılabilen girişler listelenir. USB ses kartı veya mikrofon takılıysa burada görünür; takıp çıkardıktan sonra Ayarlar’ı yeniden açın.</small></label><select class="field" id="sDev">${(()=>{const dv=devs.some(x=>x.id==st.dev)?st.dev:0; return opt(0,'Otomatik',dv)+devs.map(d=>opt(d.id, d.kind+(d.name?' · '+d.name:''), dv)).join('');})()}</select></div>
    <div class="set-row"><label>Giriş kanalı<small>Ses kartında mikrofon hangi girişe takılıysa onu seçin. “Karışım” iki girişin ortalamasını alır.</small></label><select class="field" id="sCh">${opt('mix','Mono karışım',st.ch)}${opt('l','Giriş 1 (sol)',st.ch)}${opt('r','Giriş 2 (sağ)',st.ch)}</select></div>
    <div class="set-row"><label>Alçak kesim (80 Hz)<small>Kayıt sırasında 80 Hz altını keser: masa ve zemin titreşimi, klima, trafik gürlemesi, mikrofon tutma sesi. Konuşmaya etkisi çok azdır.</small></label>${sw('sLow', st.lowCut!==false)}</div>
    <div class="set-row"><label>Kayıttan önce seviye ekranı<small>Kayda basınca önce mikrofon açılır; gain’i hedef aralığa getirip sonra kayda başlarsınız.</small></label>${sw('sPrep', st.prep!==false)}</div>
    <div class="set-row"><label>Hedef tepe aralığı<small>Dalga formunda, cetvelde ve kayıt ölçerinde sarı bantla gösterilir.</small></label><select class="field" id="sBand">${opt('off','Kapalı',st.band)}${opt('-12,-6','−12 … −6 dB',st.band)}${opt('-9,-6','−9 … −6 dB',st.band||'-9,-6')}${opt('-6,-3','−6 … −3 dB',st.band)}</select></div>
    <div class="set-row"><label>Geri sayım<small>Kayıt başlamadan önce.</small></label><select class="field" id="sCd">${opt(0,'Yok',st.countdown)}${opt(3,'3 sn',st.countdown)}${opt(5,'5 sn',st.countdown)}</select></div>
    <div class="set-row"><label>Düzeltme kaydında ön dinleme<small>Kayda girmeden önce çalınacak süre.</small></label><select class="field" id="sPre">${[1,2,3,4,5].map(v=>opt(v,v+' sn',st.preroll)).join('')}</select></div>
    <div class="set-sec">Gürültü</div>
    <div class="set-row"><label>Kayıttan önce ortam sesi<small>Kayda basınca 3 sn sessiz durursunuz. Oda sesi ölçülür ve gürültü örneği olarak saklanır; kayda eklenmez.</small></label><select class="field" id="sRoom">${opt('off','Kapalı',st.room)}${opt('first','Projede ilk kayıtta',st.room)}${opt('each','Her kayıttan önce',st.room)}</select></div>
    <div class="set-row"><label>Kayıttan sonra otomatik temizle<small>Her yeni kayda gürültü azaltma uygulanır. Ham kayıt kaybolmaz: Geri al ile dönülür.</small></label>${sw('sAuto', !!st.autoNr)}</div>
    <div class="set-row"><label>Otomatik temizlik miktarı<small>Düşük değer sese daha az dokunur.</small></label><select class="field" id="sAutoDb">${[6,8,10,12,15].map(v=>opt(v,v+' dB',st.autoNrDb||10)).join('')}</select></div>
    <div class="set-sec">Ekran</div>
    <div class="set-row"><label>Ekran yönü</label><select class="field" id="sOr">${opt('auto','Otomatik',st.orient)}${opt('portrait','Dikey',st.orient)}${opt('landscape','Yatay',st.orient)}</select></div>
    <div class="set-row"><label>Ekranı açık tut<small>Uygulama açıkken ekran kararmaz.</small></label>${sw('sKeep', st.keepScreen!==false)}</div>
    <div class="btns"><button class="btn" id="sReset">Ayarları varsayılana döndür</button></div>
    <div class="set-sec">Hakkında</div>
    <div class="hint" style="margin-top:6px">Auxera ${esc(AX.version())} · Tüm işlemler cihazda yapılır, ses dosyalarınız internete gönderilmez.<br>Ses kartı ipucu: kendinizi duymak için ses kartının “direct monitor” özelliğini kullanın; telefon üzerinden dinleme gecikmeli olur.<br>MP3 kodlayıcı: LAME tabanlı Java uygulaması (LGPL).</div>`);
  const save = o=>{ AX.setSettings(JSON.stringify(o)); Object.assign(S.settings, o); };
  $('sSr').onchange = e=>save({sr:+e.target.value});
  $('sSrc').onchange = e=>save({src:e.target.value});
  $('sRes').onchange = e=>save({res:e.target.value});
  $('sCh').onchange = e=>save({ch:e.target.value});
  $('sDev').onchange = e=>save({dev:+e.target.value});
  $('sCd').onchange = e=>save({countdown:+e.target.value});
  $('sPre').onchange = e=>save({preroll:+e.target.value});
  $('sOr').onchange = e=>save({orient:e.target.value});
  $('sRoom').onchange = e=>save({room:e.target.value});
  $('sPrep').onclick = e=>{ const on = !e.currentTarget.classList.contains('on'); e.currentTarget.classList.toggle('on', on); save({prep:on}); };
  $('sBand').onchange = e=>{ save({band:e.target.value}); if(S.screen==='editor') draw(); };
  $('sAutoDb').onchange = e=>save({autoNrDb:+e.target.value});
  $('sAuto').onclick = e=>{ const on = !e.currentTarget.classList.contains('on'); e.currentTarget.classList.toggle('on', on); save({autoNr:on}); if(on && (S.settings.room||'off')==='off' && !(S.st && S.st.noise)) toast('Otomatik temizlik için gürültü örneği gerekir. “Kayıttan önce ortam sesi”ni açın ya da Temizle › Gürültü ile örnek alın.', 4800); };
  $('sReset').onclick = ()=>confirmDialog('Ayarlar sıfırlansın mı?', 'Kayıt, gürültü ve ekran ayarları ilk hâline döner. Kayıtlarınız etkilenmez.', 'Sıfırla', ()=>{ S.settings = J(AX.resetSettings()) || {}; closeSheet(); setTimeout(openSettings, 250); toast('Ayarlar varsayılana döndü'); });
  $('sLow').onclick = e=>{ const on = !e.currentTarget.classList.contains('on'); e.currentTarget.classList.toggle('on', on); save({lowCut:on}); };
  $('sKeep').onclick = e=>{ const on = !e.currentTarget.classList.contains('on'); e.currentTarget.classList.toggle('on', on); save({keepScreen:on}); };
}

// =====================================================================================
// native events
// =====================================================================================
window.AXev = function(type, d){
  try{
    if(type==='job') onJob(d);
    else if(type==='play'){ if(d.end){ S.playing=false; S.ppos=-1; setPlayIcon(); abUpd(false); draw(); } }
    else if(type==='rec') recFinished(d);
    else if(type==='spec') onSpec(d);
    else if(type==='perm'){ const cb=S.permCb; S.permCb=null; if(cb) cb(!!d.mic); }
    else if(type==='saved'){ toast(d.ok? 'Kaydedildi: '+d.name : ('Kaydedilemedi: '+(d.error||'')), 3000); }
    else if(type==='busy'){ showBusy(); }
    else if(type==='key'){ if(d.k==='mark' || !PR.active) recMark(); else prKey(d.k); }
    else if(type==='script'){ if(d.ok && $('scTxt')){ $('scTxt').value = d.text; toast('Metin dosyadan alındı · Kaydet ile saklayın'); } else if(!d.ok) toast(d.error||'Metin okunamadı'); }
  }catch(e){ console.error(e); }
};
window.AXback = function(){
  if(closeDialog()) return true;
  if(closeMenu()) return true;
  if(!$('recov').classList.contains('hide')) return true;
  if(closeSheet()) return true;
  if(S.playing){ stopPlay(); return true; }
  if(S.screen==='editor'){ if(S.breath){ S.breath=null; draw(); return true; } goHome(); return true; }
  return false;
};

// ---- first-run intro ----
const INTRO = [
  {t:'Kayıt', i:'mic', b:'Kayda basınca önce seviye ekranı açılır: tepeler sarı bandın içinde kalacak şekilde gain’i ayarlayıp kırmızı düğmeyle başlayın. Okurken hata yaparsanız <b>kırmızı bayrağa</b> ya da kulaklık/pedal tuşuna basın.'},
  {t:'Düzenleme', i:'cut', b:'Dalgada tek parmakla sürükleyerek seçin, iki parmakla yakınlaştırın. Kaydırmak için zaman cetvelini sürükleyin ya da sağ üstteki <b>el</b> düğmesini açın. Seçim süresine dokunursanız milisaniye ayarı açılır; geri al düğmesine basılı tutunca geçmiş açılır.'},
  {t:'Temizlik ve teslim', i:'noise', b:'Temizle sekmesi gürültü, nefes, ağız sesi ve uğultuyu temizler; her araçta önce <b>Dinle</b> ile orijinalle karşılaştırın. Araca basılı tutarsanız ne yaptığı yazar. Dışa aktarmada sesli kitap, stüdyo ve paylaşım hazır ayarları var.'}
];
function showIntro(force){
  if(!force && S.settings.introDone) return;
  let k = 0;
  const el = document.createElement('div'); el.className = 'intro'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Kısa tanıtım');
  const render = ()=>{
    const it = INTRO[k];
    el.innerHTML = `<div class="card2"><div class="ih">${ic(it.i)}${it.t}</div><p>${it.b}</p>
      <div class="dots">${INTRO.map((_,j)=>`<i class="${j===k?'on':''}"></i>`).join('')}</div>
      <div class="btns" style="margin-top:0"><button class="btn" id="inSkip">${k===INTRO.length-1?'Kapat':'Geç'}</button><button class="btn pri" id="inNext">${k===INTRO.length-1?'Başla':'İleri'}</button></div></div>`;
    $('inSkip').onclick = done; $('inNext').onclick = ()=>{ if(k < INTRO.length-1){ k++; render(); } else done(); };
  };
  const done = ()=>{ el.remove(); S.settings.introDone = true; AX.setSettings(JSON.stringify({introDone:true})); };
  document.body.appendChild(el); render();
}

(function boot(){
  const st = J(AX.state());
  const rs = J(AX.recState());
  if(st && st.open){
    enterEditor(st);
    if(rs && rs.on){ rec = {mode:'insert', a:0, pre:0, blocks:[], from:0, m:newMeter(), paused:!!rs.paused}; $('recov').classList.remove('hide'); sizeRecCanvas(); recPoll(); }
  } else { renderHome(); showScreen('home'); }
  setTimeout(()=>showIntro(false), 300);
})();
